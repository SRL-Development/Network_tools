name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: "1.2.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build:win
      - name: Package Windows x64
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          $name = "netops-console-v$version-windows-x64"
          New-Item -ItemType Directory -Path "dist/release/$name" -Force | Out-Null
          Copy-Item "dist/bin/netops-console-windows-x64.exe" "dist/release/$name/"
          Copy-Item "deploy/windows/启动平台.cmd" "dist/release/$name/"
          Copy-Item "deploy/windows/README.txt" "dist/release/$name/"
          Compress-Archive -Path "dist/release/$name" -DestinationPath "dist/release/$name.zip" -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/release/*.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:linux
      - name: Package Linux x64
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          [[ -n "${version}" ]] || version="${GITHUB_REF_NAME#v}"
          name="netops-console-v${version}-linux-x64"
          mkdir -p "dist/release/${name}"
          cp dist/bin/netops-console-linux-x64 "dist/release/${name}/netops-console"
          cp deploy/linux/install.sh deploy/linux/netops-console.service deploy/linux/README.txt "dist/release/${name}/"
          chmod 0755 "dist/release/${name}/netops-console" "dist/release/${name}/install.sh"
          tar -C dist/release -czf "dist/release/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/release/*.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:mac
      - name: Sign and package macOS Intel / Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          [[ -n "${version}" ]] || version="${GITHUB_REF_NAME#v}"
          name="netops-console-v${version}-macos"
          codesign --force --sign - dist/bin/netops-console-macos-x64
          codesign --force --sign - dist/bin/netops-console-macos-arm64
          codesign --verify dist/bin/netops-console-macos-x64
          codesign --verify dist/bin/netops-console-macos-arm64
          mkdir -p "dist/release/${name}"
          cp dist/bin/netops-console-macos-x64 dist/bin/netops-console-macos-arm64 "dist/release/${name}/"
          cp deploy/macos/start.command deploy/macos/install-tools.command deploy/macos/README.txt "dist/release/${name}/"
          chmod 0755 "dist/release/${name}"/netops-console-macos-* "dist/release/${name}"/*.command
          tar -C dist/release -czf "dist/release/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/*.tar.gz
          if-no-files-found: error

  docker-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Docker Compose source
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          [[ -n "${version}" ]] || version="${GITHUB_REF_NAME#v}"
          name="netops-console-v${version}-docker"
          mkdir -p "dist/release/${name}"
          cp Dockerfile docker-compose.yml .dockerignore package.json package-lock.json "dist/release/${name}/"
          cp deploy/docker/README.txt "dist/release/${name}/"
          cp -R public server "dist/release/${name}/"
          tar -C dist/release -czf "dist/release/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-docker
          path: dist/release/*.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, linux, macos, docker-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release
          sha256sum netops-console-* > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}
          name: NetOps Console ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }} · 全球网络诊断增强
          generate_release_notes: true
          body: |
            本版本把网络运维工具箱扩展到 30 个工具、14 个分类，并新增：

            - TCP 多端口连通质量：重复建连成功率、最小/平均/最大时延、间歇失败诊断
            - DoH / DNSSEC：Cloudflare 与 Google 加密 DNS 多源核验、AD 状态和一致性结论
            - ASN / BGP / RPKI：IP、CIDR、ASN 的全球路由公告、起源网络和 ROA 验证
            - 全部新增工具均接入参数校验、权限门禁、审计记录、结论和下一步建议
            - Windows、Linux、Docker、macOS 四套交付包由对应原生系统自动构建

            > 首次登录：`admin / admin@123`，请登录后立即修改密码。
          files: |
            release/*
          fail_on_unmatched_files: true
